AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: sangseng-navigator backend

Parameters:
  LlmProvider:      { Type: String, Default: openai }
  OpenAiApiKey:     { Type: String, Default: '', NoEcho: true }
  AnthropicApiKey:  { Type: String, Default: '', NoEcho: true }
  MutationApiToken: { Type: String, Default: '', NoEcho: true }
  # 무인증 공개 URL의 generate 엔드포인트가 호출마다 LLM을 부르므로 동시성 상한을 기본값으로 건다 (09 §5.5)
  ReservedConcurrency: { Type: Number, Default: 5 }   # -1이면 설정 자체를 생략(계정 동시성 한도가 낮아 배포 실패할 때)
  # fail-safe: 배포자가 실제 프론트 오리진을 넣기 전에는 어떤 브라우저 오리진도 허용하지 않는다.
  AllowedOrigins:      { Type: String, Default: 'https://configure-me.invalid' }
  DemoReadOnly:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, '-1']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30          # LLM 호출 여유
    MemorySize: 512

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # ⚠ HTTP API에 CorsConfiguration이 붙어 있으면 API Gateway가 **통합(Lambda)이 돌려준 CORS
        # 헤더를 무시**하고 자기 설정으로 덮는다. 따라서 앱의 ALLOWED_ORIGINS만 좁혀도 배포에서는
        # 효력이 없다 — 같은 파라미터를 여기에도 걸어 두 층이 항상 함께 움직이게 한다 (09 문서 §5).
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, X-Request-ID]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: app.main.handler
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          CARDS_TABLE: !Ref CardsTable
          PROGRESS_RECORDS_TABLE: !Ref ProgressRecordsTable
          LLM_PROVIDER: !Ref LlmProvider
          OPENAI_API_KEY: !Ref OpenAiApiKey
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          MUTATION_API_TOKEN: !Ref MutationApiToken
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          DEMO_READ_ONLY: !Ref DemoReadOnly
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CardsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ProgressRecordsTable }
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource:
                - !GetAtt CardsTable.Arn
                - !GetAtt ProgressRecordsTable.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/{proxy+}', Method: ANY }

  CardsTable:
    Type: AWS::Serverless::SimpleTable        # PAY_PER_REQUEST(온디맨드) 기본
    Properties:
      PrimaryKey: { Name: id, Type: String }

  ProgressRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: record_id, AttributeType: S }
        - { AttributeName: card_id, AttributeType: S }
        - { AttributeName: report_bucket, AttributeType: S }
        - { AttributeName: recorded_at_key, AttributeType: S }
      KeySchema:
        - { AttributeName: record_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: card-recorded-at-index
          KeySchema:
            - { AttributeName: card_id, KeyType: HASH }
            - { AttributeName: recorded_at_key, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: report-bucket-recorded-at-index
          KeySchema:
            - { AttributeName: report_bucket, KeyType: HASH }
            - { AttributeName: recorded_at_key, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7                      # 로그 비용 방지

Outputs:
  ApiUrl:     { Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com' }
  CardsTable: { Value: !Ref CardsTable }
  ProgressRecordsTable: { Value: !Ref ProgressRecordsTable }
