# 로컬 통합 테스트 환경 — `docker compose up -d` 하나로 DynamoDB + BE + FE 가 전부 뜬다.
# (개발 중 AWS 배포 금지 — 테스트는 전부 여기서, docs/plan/14 문서 머리말)
#
#   docker compose up -d          # 전체 기동 → FE http://localhost:3100, BE http://localhost:8000
#   docker compose logs -f        # 로그
#   docker compose down           # 정리
#
# 오버라이드 (레포 루트 .env 또는 셸 환경변수):
#   FRONTEND_PORT=3100            # 배포·검증 기준 호스트 포트
#   FRONTEND_API_BASE=http://backend:8000   # FE 가 볼 API 주소. 비우면 FE 빌드가 실패한다
#                                           # (mock 폴백 제거 — 주소 없이는 화면을 그리지 않는다)
#   DEMO_READ_ONLY=true           # FE·BE 를 함께 읽기 전용으로 잠근다 (기본 false — 승인 버튼 동작)
#   MUTATION_API_TOKEN=           # 비우면 양쪽 다 local-dev-token (BE 검증값 = FE 발신값)
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports: ["8001:8000"]

  # 데모 시드 (11 문서 §1 '사전 상태') — 카드 5장(데모 3 + 분기 이력 2) + 추진 기록 9건.
  # 1회 실행 후 종료하는 one-shot 서비스다.
  # dynamodb 가 -inMemory 라 컨테이너가 재시작되면 테이블 자체가 사라진다 —
  # 그래서 매 `up` 마다 --reset 으로 다시 만드는 게 맞다 (데모 중 만든 카드는 초기화된다).
  seed:
    build: ./backend
    env_file: .env
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      CARDS_TABLE: sangseng-cards
      PROGRESS_RECORDS_TABLE: sangseng-progress-records
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/seed_demo.py:/app/seed_demo.py:ro   # 이미지에는 app/ 만 들어 있다
      - ./data/processed:/app/app/data:ro
    depends_on: [dynamodb]
    restart: "no"
    # DynamoDB Local 기동을 기다린다 (healthcheck 를 붙일 수단이 없는 이미지라 재시도로 대신)
    command: >
      sh -c 'for i in $$(seq 1 30); do python seed_demo.py --reset && exit 0; sleep 2; done; exit 1'

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      CARDS_TABLE: sangseng-cards
      PROGRESS_RECORDS_TABLE: sangseng-progress-records
      MUTATION_API_TOKEN: "${MUTATION_API_TOKEN:-local-dev-token}"
      AWS_ACCESS_KEY_ID: local          # DynamoDB Local은 자격증명 "형식"만 요구
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./backend/app:/app/app                    # 코드 핫리로드
      - ./data/processed:/app/app/data:ro         # ECS 이미지와 동일 경로(/app/app/data)
    depends_on: [dynamodb]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3100}:3000"]
    environment:
      # 기본값은 실 BE 연동이다. 페이지가 서버 컴포넌트라 fetch 가 **컨테이너 안에서** 일어나므로
      # 컨테이너 네트워크 주소를 쓴다 — http://localhost:8000 을 넣으면 ECONNREFUSED 가 난다.
      # (컨테이너 밖 `npm run dev` 는 frontend/.env.local 에 http://localhost:8000)
      # ⚠ 빈 값으로 두지 말 것 — mock 폴백이 없어 FE 가 모듈 로드에서 실패한다.
      NEXT_PUBLIC_API_BASE: "${FRONTEND_API_BASE:-http://backend:8000}"
      API_MUTATION_TOKEN: "${MUTATION_API_TOKEN:-local-dev-token}"
      # 읽기 전용 잠금은 FE·BE가 **같은 값**을 봐야 한다. 여기서 넘기지 않으면 루트 .env에
      # DEMO_READ_ONLY=true 를 넣어도 BE만 403으로 잠기고 FE 버튼은 전부 열린 채로 남는다.
      # (next.config.mjs의 루트 .env 승계는 컨테이너에 ./frontend 만 마운트돼 그 파일이 없어 동작하지 않는다)
      NEXT_PUBLIC_DEMO_READ_ONLY: "${DEMO_READ_ONLY:-false}"
      # 허브 인사말·사이드바 계정 칸의 담당자 표시명 (선택, 표시용이라 민감 정보 아님).
      # 비우면 lib/operator.ts 가 데모 시드 이름으로 폴백한다. 같은 이유로 여기서 전달해야 한다.
      NEXT_PUBLIC_OPERATOR_NAME: "${NEXT_PUBLIC_OPERATOR_NAME-}"
      NEXT_PUBLIC_OPERATOR_TEAM: "${NEXT_PUBLIC_OPERATOR_TEAM-}"
      # 방문객 위젯의 Kakao 지도 (선택). 키가 없거나 도메인이 미등록이면 지도형 fallback을 보인다.
      # ⚠ KAKAO_REST_API_KEY(지오코딩용)와 다른 **JavaScript 키**이고, Kakao 앱의
      #   [플랫폼]>[Web]에 이 컨테이너가 열리는 주소(기본 http://localhost:3100)를 등록해야 뜬다.
      NEXT_PUBLIC_KAKAO_MAP_KEY: "${NEXT_PUBLIC_KAKAO_MAP_KEY-}"
      # 방문객 위젯 "오늘의 추천"의 기상청 초단기실황 호출 (선택).
      # ⚠ FE **서버**에서만 쓰는 값이라 NEXT_PUBLIC_ 접두사를 붙이지 않는다 — 붙이면 브라우저
      #   번들에 키가 실린다. 비어 있으면 날씨 줄만 빠지고 요일 문구는 그대로 나온다.
      #   (frontend 서비스에 env_file: .env 를 붙이면 안 된다 — OPENAI_API_KEY 까지 통째로 들어간다)
      DATA_GO_KR_API_KEY: "${DATA_GO_KR_API_KEY-}"
      WATCHPACK_POLLING: "true"                   # 바인드 마운트에서 파일 변경 감지(HMR)
    volumes:
      - ./frontend:/app                           # 코드 핫리로드
      - /app/node_modules                         # 호스트 마운트가 이미지의 의존성을 가리지 않게
      - /app/.next
    depends_on: [backend]
